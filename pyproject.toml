[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "camel"
version = "0.1.0"
description = "from-scratch autograd deep learning library: C kernels + Python autograd/nn/optim"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["camel"]
